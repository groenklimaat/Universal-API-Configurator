<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG → PWA Iconen (192 + 512)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --text-dim: #8b93a3;
    --accent: #4d9fff;
    --green: #3ddc84;
    --orange: #ffa94d;
    --purple: #b197fc;
    --red: #ff6b6b;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container { max-width: 1100px; margin: 0 auto; }

  header {
    text-align: center;
    margin-bottom: 2rem;
  }

  h1 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 1rem;
  }

  /* ===== Drop Zone ===== */
  .dropzone {
    background: var(--card);
    border: 2px dashed var(--border);
    border-radius: 20px;
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    margin-bottom: 2rem;
  }

  .dropzone:hover {
    border-color: var(--accent);
    background: #1d2130;
  }

  .dropzone.dragover {
    border-color: var(--green);
    background: rgba(61, 220, 132, 0.08);
    transform: scale(1.01);
  }

  .dropzone.loaded {
    border-color: var(--green);
    border-style: solid;
    padding: 1.5rem;
  }

  .drop-icon {
    font-size: 3.5rem;
    margin-bottom: 1rem;
    display: block;
  }

  .drop-title {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }

  .drop-hint {
    color: var(--text-dim);
    font-size: 0.9rem;
  }

  .file-input { display: none; }

  /* ===== Preview ===== */
  .preview-section {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.75rem;
    margin-bottom: 2rem;
  }

  .preview-section.active { display: block; }

  .source-preview {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.5rem;
  }

  .source-thumb {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #2a2f3a, #1a1d24);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }

  .source-thumb img,
  .source-thumb svg {
    max-width: 80%;
    max-height: 80%;
  }

  .source-info { flex: 1; min-width: 0; }
  .source-name { font-weight: 600; word-break: break-all; }
  .source-meta { color: var(--text-dim); font-size: 0.85rem; }

  /* ===== Icon Grid ===== */
  .icons-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.25rem;
    margin-bottom: 1.75rem;
  }

  .icon-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem;
    text-align: center;
    transition: all 0.2s;
  }

  .icon-card:hover {
    background: rgba(255,255,255,0.06);
    transform: translateY(-2px);
  }

  .icon-card.maskable {
    border-color: rgba(255, 169, 77, 0.4);
    background: rgba(255, 169, 77, 0.05);
  }

  .icon-preview {
    width: 100%;
    aspect-ratio: 1;
    background:
      linear-gradient(45deg, #2a2f3a 25%, transparent 25%),
      linear-gradient(-45deg, #2a2f3a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2f3a 75%),
      linear-gradient(-45deg, transparent 75%, #2a2f3a 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    background-color: #1a1d24;
    border-radius: 10px;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .icon-preview img {
    max-width: 85%;
    max-height: 85%;
  }

  /* Maskable safe zone indicator */
  .icon-card.maskable .icon-preview::after {
    content: "";
    position: absolute;
    inset: 10%;
    border: 2px dashed rgba(255, 169, 77, 0.5);
    border-radius: 50%;
    pointer-events: none;
  }

  .icon-label {
    font-size: 0.95rem;
    font-weight: 600;
    font-family: "SF Mono", Consolas, monospace;
    margin-bottom: 0.25rem;
  }

  .icon-purpose {
    color: var(--text-dim);
    font-size: 0.8rem;
    margin-bottom: 0.85rem;
    min-height: 2.2em;
  }

  .btn-download {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    width: 100%;
    padding: 0.55rem 1rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }

  .btn-download:hover {
    background: #3a8bef;
    transform: translateY(-1px);
  }

  .btn-download.maskable-btn {
    background: var(--orange);
    color: #1a1d24;
  }

  .btn-download.maskable-btn:hover {
    background: #ffb968;
  }

  /* ===== Bulk Actions ===== */
  .bulk-actions {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.5rem;
    border-radius: 10px;
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--green), #2ecc71);
    color: #0f1115;
  }

  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(61,220,132,0.3); }

  .btn-secondary {
    background: var(--border);
    color: var(--text);
  }

  .btn-secondary:hover { background: #343a48; }

  /* ===== Settings ===== */
  .settings {
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .settings label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.9rem;
    color: var(--text-dim);
    cursor: pointer;
  }

  .settings input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--orange);
    cursor: pointer;
  }

  /* ===== Footer ===== */
  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
    padding: 2rem 0;
    margin-top: 2rem;
    border-top: 1px solid var(--border);
  }

  footer code {
    background: var(--card);
    padding: 0.15rem 0.45rem;
    border-radius: 4px;
    font-family: "SF Mono", Consolas, monospace;
    color: var(--accent);
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--card);
    border: 1px solid var(--green);
    color: var(--text);
    padding: 0.85rem 1.5rem;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: 500;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 1000;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 600px) {
    h1 { font-size: 1.5rem; }
    body { padding: 1rem 0.75rem; }
    .dropzone { padding: 2rem 1rem; }
    .source-preview { flex-direction: column; text-align: center; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>SVG → PWA Iconen</h1>
    <p class="subtitle">Sleep je SVG en krijg automatisch <strong>192×192</strong> en <strong>512×512</strong> PNG-bestanden</p>
  </header>

  <!-- Drop Zone -->
  <div class="dropzone" id="dropzone">
    <input type="file" id="fileInput" class="file-input" accept=".svg,image/svg+xml">
    <span class="drop-icon">📤</span>
    <div class="drop-title">Sleep je SVG hierheen</div>
    <div class="drop-hint">of klik om een bestand te kiezen</div>
  </div>

  <!-- Preview Section -->
  <div class="preview-section" id="previewSection">
    <div class="source-preview">
      <div class="source-thumb" id="sourceThumb"></div>
      <div class="source-info">
        <div class="source-name" id="sourceName">—</div>
        <div class="source-meta" id="sourceMeta">—</div>
      </div>
    </div>

    <div class="icons-grid" id="iconsGrid"></div>

    <div class="settings">
      <label>
        <input type="checkbox" id="chkMaskable" checked>
        Genereer ook maskable versies (aanbevolen voor Android)
      </label>
    </div>

    <div class="bulk-actions">
      <button class="btn btn-primary" id="btnDownloadAll">
        ⬇️ Download alle bestanden
      </button>
      <button class="btn btn-secondary" id="btnReset">
        🔄 Nieuw bestand
      </button>
    </div>
  </div>

  <footer>
    💡 Alles gebeurt lokaal in je browser — je SVG wordt <strong>niet</strong> geüpload.<br>
    Output: <code>icon-192.png</code>, <code>icon-512.png</code> + optioneel <code>maskable</code> varianten.
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// Configuratie
// ============================================================
const ICONS = [
  { size: 192, name: "icon-192.png", purpose: "Android home screen, manifest (verplicht)", maskable: false },
  { size: 512, name: "icon-512.png", purpose: "Splash screen, manifest (verplicht)", maskable: false },
  { size: 192, name: "icon-192-maskable.png", purpose: "Adaptive icon Android (veilige zone 80%)", maskable: true },
  { size: 512, name: "icon-512-maskable.png", purpose: "Adaptive splash Android (veilige zone 80%)", maskable: true },
];

const MASKABLE_PADDING = 0.20; // 20% padding → veilige zone 80%

// ============================================================
// State
// ============================================================
let currentSvgText = null;
let currentFileName = null;
const generatedFiles = {}; // { filename: Blob }

// ============================================================
// DOM referenties
// ============================================================
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const previewSection = document.getElementById("previewSection");
const sourceThumb = document.getElementById("sourceThumb");
const sourceName = document.getElementById("sourceName");
const sourceMeta = document.getElementById("sourceMeta");
const iconsGrid = document.getElementById("iconsGrid");
const chkMaskable = document.getElementById("chkMaskable");
const btnDownloadAll = document.getElementById("btnDownloadAll");
const btnReset = document.getElementById("btnReset");
const toast = document.getElementById("toast");

// ============================================================
// Toast
// ============================================================
function showToast(msg, duration = 2500) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), duration);
}

// ============================================================
// Drag & Drop
// ============================================================
dropzone.addEventListener("click", () => fileInput.click());

["dragenter", "dragover"].forEach(evt =>
  dropzone.addEventListener(evt, e => {
    e.preventDefault();
    e.stopPropagation();
    dropzone.classList.add("dragover");
  })
);

["dragleave", "drop"].forEach(evt =>
  dropzone.addEventListener(evt, e => {
    e.preventDefault();
    e.stopPropagation();
    dropzone.classList.remove("dragover");
  })
);

dropzone.addEventListener("drop", e => {
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});

fileInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if (file) handleFile(file);
});

// ============================================================
// Bestand verwerken
// ============================================================
async function handleFile(file) {
  if (!file.name.toLowerCase().endsWith(".svg") && file.type !== "image/svg+xml") {
    showToast("❌ Alleen SVG-bestanden zijn toegestaan");
    return;
  }

  try {
    const text = await file.text();
    currentSvgText = text;
    currentFileName = file.name;

    // Toon bron preview
    renderSourcePreview(file);
    previewSection.classList.add("active");

    // Genereer alle iconen
    await generateAllIcons();
    showToast(`✅ ${Object.keys(generatedFiles).length} bestanden gegenereerd`);
  } catch (err) {
    console.error(err);
    showToast("❌ Fout bij verwerken: " + err.message);
  }
}

function renderSourcePreview(file) {
  sourceThumb.innerHTML = "";
  const cloned = document.importNode(
    new DOMParser().parseFromString(currentSvgText, "image/svg+xml").documentElement,
    true
  );
  // Zet vaste afmetingen voor de thumbnail
  cloned.removeAttribute("width");
  cloned.removeAttribute("height");
  cloned.setAttribute("width", "64");
  cloned.setAttribute("height", "64");
  sourceThumb.appendChild(cloned);

  sourceName.textContent = file.name;
  const sizeKb = (file.size / 1024).toFixed(1);
  sourceMeta.textContent = `${sizeKb} KB · SVG`;
}

// ============================================================
// SVG → PNG conversie via canvas
// ============================================================
function svgToPngBlob(svgText, size, maskable = false) {
  return new Promise((resolve, reject) => {
    // Zorg dat de SVG een viewBox heeft
    const parser = new DOMParser();
    const doc = parser.parseFromString(svgText, "image/svg+xml");
    const svgEl = doc.documentElement;

    if (svgEl.nodeName === "parsererror") {
      return reject(new Error("Ongeldige SVG"));
    }

    // Voeg viewBox toe als die ontbreekt
    if (!svgEl.getAttribute("viewBox")) {
      const w = parseFloat(svgEl.getAttribute("width")) || 512;
      const h = parseFloat(svgEl.getAttribute("height")) || 512;
      svgEl.setAttribute("viewBox", `0 0 ${w} ${h}`);
    }

    // Verwijder vaste width/height voor schaalbaarheid
    svgEl.removeAttribute("width");
    svgEl.removeAttribute("height");

    // Serialize terug
    const cleanSvg = new XMLSerializer().serializeToString(svgEl);
    const blob = new Blob([cleanSvg], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(blob);

    const img = new Image();
    img.onload = () => {
      // Canvas in 2× resolutie voor scherpte, dan downsizen
      const scale = 2;
      const renderSize = size * scale;

      const canvas = document.createElement("canvas");
      canvas.width = renderSize;
      canvas.height = renderSize;
      const ctx = canvas.getContext("2d");

      // Transparante achtergrond (default)
      ctx.clearRect(0, 0, renderSize, renderSize);

      // Teken de SVG
      if (maskable) {
        const innerSize = renderSize * (1 - 2 * MASKABLE_PADDING);
        const offset = (renderSize - innerSize) / 2;
        ctx.drawImage(img, offset, offset, innerSize, innerSize);
      } else {
        ctx.drawImage(img, 0, 0, renderSize, renderSize);
      }

      // Downsize naar definitieve grootte voor anti-aliasing
      const finalCanvas = document.createElement("canvas");
      finalCanvas.width = size;
      finalCanvas.height = size;
      const finalCtx = finalCanvas.getContext("2d");
      finalCtx.imageSmoothingEnabled = true;
      finalCtx.imageSmoothingQuality = "high";
      finalCtx.drawImage(canvas, 0, 0, size, size);

      URL.revokeObjectURL(url);

      finalCanvas.toBlob(blob => {
        if (blob) resolve(blob);
        else reject(new Error("Canvas → Blob mislukt"));
      }, "image/png");
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("SVG kon niet geladen worden"));
    };
    img.src = url;
  });
}

// ============================================================
// Alle iconen genereren
// ============================================================
async function generateAllIcons() {
  if (!currentSvgText) return;

  // Reset
  Object.keys(generatedFiles).forEach(k => delete generatedFiles[k]);
  iconsGrid.innerHTML = "";

  const includeMaskable = chkMaskable.checked;
  const toGenerate = ICONS.filter(i => !i.maskable || includeMaskable);

  for (const iconDef of toGenerate) {
    // Placeholder kaart
    const card = createIconCard(iconDef);
    iconsGrid.appendChild(card);

    try {
      const blob = await svgToPngBlob(currentSvgText, iconDef.size, iconDef.maskable);
      generatedFiles[iconDef.name] = blob;

      // Update preview met echte PNG
      const img = card.querySelector(".icon-preview img");
      img.src = URL.createObjectURL(blob);

      // Activeer download-knop
      const btn = card.querySelector(".btn-download");
      btn.disabled = false;
      btn.onclick = () => downloadBlob(blob, iconDef.name);
    } catch (err) {
      console.error("Fout bij " + iconDef.name, err);
      card.querySelector(".icon-purpose").textContent = "❌ " + err.message;
    }
  }
}

function createIconCard(iconDef) {
  const card = document.createElement("div");
  card.className = "icon-card" + (iconDef.maskable ? " maskable" : "");
  card.innerHTML = `
    <div class="icon-preview">
      <img alt="${iconDef.name}">
    </div>
    <div class="icon-label">${iconDef.size} × ${iconDef.size}</div>
    <div class="icon-purpose">${iconDef.purpose}</div>
    <button class="btn-download ${iconDef.maskable ? 'maskable-btn' : ''}" disabled>
      ⬇️ ${iconDef.name}
    </button>
  `;
  return card;
}

// ============================================================
// Download
// ============================================================
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 100);
}

btnDownloadAll.addEventListener("click", async () => {
  const files = Object.entries(generatedFiles);
  if (files.length === 0) {
    showToast("⚠️ Nog geen bestanden gegenereerd");
    return;
  }

  // Als JSZip beschikbaar is → ZIP, anders individueel downloaden
  if (typeof JSZip !== "undefined") {
    const zip = new JSZip();
    for (const [name, blob] of files) {
      zip.file(name, blob);
    }
    const zipBlob = await zip.generateAsync({ type: "blob" });
    downloadBlob(zipBlob, "pwa-icons.zip");
    showToast(`📦 ZIP gedownload (${files.length} bestanden)`);
  } else {
    // Fallback: download individueel met kleine vertraging
    for (let i = 0; i < files.length; i++) {
      const [name, blob] = files[i];
      setTimeout(() => downloadBlob(blob, name), i * 300);
    }
    showToast(`⬇️ ${files.length} bestanden worden gedownload`);
  }
});

// ============================================================
// Reset
// ============================================================
btnReset.addEventListener("click", () => {
  currentSvgText = null;
  currentFileName = null;
  fileInput.value = "";
  Object.keys(generatedFiles).forEach(k => delete generatedFiles[k]);
  previewSection.classList.remove("active");
  sourceThumb.innerHTML = "";
  iconsGrid.innerHTML = "";
  showToast("🔄 Klaar voor een nieuw bestand");
});

// ============================================================
// Maskable toggle → hergenereer
// ============================================================
chkMaskable.addEventListener("change", () => {
  if (currentSvgText) generateAllIcons();
});

// ============================================================
// Optioneel: laad JSZip voor ZIP-download
// ============================================================
(function loadJSZip() {
  const script = document.createElement("script");
  script.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
  script.onload = () => console.log("✅ JSZip geladen — ZIP-download beschikbaar");
  script.onerror = () => console.log("ℹ️ JSZip niet geladen — individuele downloads");
  document.head.appendChild(script);
})();

</script>
</body>
</html>
