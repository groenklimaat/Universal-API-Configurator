<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universal API Monitor</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#052e16,#16a34a,#84cc16);
min-height:100vh;padding:20px;color:#e2e8f0}
.box{max-width:800px;margin:0 auto;background:#0f172a;border-radius:20px;padding:28px;
box-shadow:0 20px 50px rgba(0,0,0,.5);border:3px solid #22c55e}
h1{font-size:22px;color:#86efac;margin-bottom:6px}
.sub{color:#94a3b8;font-size:13px;margin-bottom:20px}
label{display:block;margin-top:14px;font-weight:700;font-size:13px;color:#cbd5e1}
input,select,textarea{width:100%;padding:10px;margin-top:5px;border:2px solid #334155;
border-radius:10px;background:#1e293b;color:#fff;font-size:14px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#22c55e}
textarea{font-family:monospace;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.mrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mbtn{padding:8px 14px;border:2px solid #334155;background:#1e293b;color:#cbd5e1;
border-radius:8px;cursor:pointer;font-weight:700;font-size:12px}
.mbtn.active{background:#22c55e;color:#052e16;border-color:#22c55e}
button.big{width:100%;margin-top:18px;padding:14px;border:none;border-radius:12px;
background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-size:15px;
font-weight:800;cursor:pointer}
button.big:hover{filter:brightness(1.1)}
button.copy{background:linear-gradient(135deg,#84cc16,#22c55e);margin-top:10px}
.prev{margin-top:10px;padding:12px;background:#020617;border-radius:10px;
font-family:monospace;font-size:12px;color:#86efac;word-break:break-all;min-height:40px}
.status{margin-top:14px;padding:12px;border-radius:10px;font-weight:700;display:none}
.ok{background:#065f46;color:#a7f3d0}.err{background:#7f1d1d;color:#fecaca}
.resp{display:none;margin-top:12px;padding:14px;background:#020617;border-radius:10px;
font-family:monospace;font-size:12px;color:#cbd5e1;max-height:300px;overflow:auto;
white-space:pre-wrap;word-break:break-word}
.log{margin-top:20px;border:2px solid #334155;border-radius:12px;background:#020617;overflow:hidden}
.log h2{padding:10px 14px;background:#1e293b;font-size:14px;color:#86efac;border-bottom:2px solid #334155}
.log ul{list-style:none;max-height:250px;overflow-y:auto;font-family:monospace;font-size:11px}
.log li{padding:6px 12px;border-bottom:1px solid #1e293b;display:flex;gap:8px;color:#cbd5e1}
.log li.ok{color:#4ade80}.log li.err{color:#f87171}
</style>
</head>
<body>
<div class="box">
<h1>🌐 Universal API Monitor</h1>
<p class="sub">Vul een API key en URL in. Klik Verzenden. Klaar.</p>

<label>API key</label>
<input type="text" id="apikey" placeholder="Plak hier je API key">

<label>API key parameter (bv. appid)</label>
<input type="text" id="keyparam" value="appid">

<label>URL</label>
<input type="url" id="url" placeholder="https://api.example.com/endpoint">

<div class="mrow" id="mrow">
<button type="button" class="mbtn active" data-m="GET">GET</button>
<button type="button" class="mbtn" data-m="POST">POST</button>
<button type="button" class="mbtn" data-m="PUT">PUT</button>
<button type="button" class="mbtn" data-m="DELETE">DELETE</button>
</div>

<label>Body (JSON, alleen voor POST/PUT)</label>
<textarea id="body" rows="2" placeholder='{"key":"value"}'></textarea>

<div class="prev" id="prev">(vul URL in)</div>

<button type="button" class="big" id="send">🚀 Verzenden</button>
<button type="button" class="big copy" id="copy">📋 Kopieer URL</button>

<div class="status" id="status"></div>
<pre class="resp" id="resp"></pre>

<div class="log">
<h2>📊 Monitor Log</h2>
<ul id="loglist"><li style="color:#64748b;padding:20px;text-align:center">Nog geen logs</li></ul>
</div>
</div>

<script>
var $ = function(id){return document.getElementById(id)};
var method = "GET";

document.getElementById("mrow").addEventListener("click", function(e){
  var b = e.target.closest(".mbtn"); if(!b) return;
  document.querySelectorAll(".mbtn").forEach(function(x){x.classList.remove("active")});
  b.classList.add("active");
  method = b.dataset.m;
  updatePrev();
});

function buildUrl(){
  var u = $("url").value.trim();
  var k = $("apikey").value.trim();
  var p = $("keyparam").value.trim() || "appid";
  if(!u) return "";
  try{
    var url = new URL(u);
    if(k) url.searchParams.set(p, k);
    return url.toString();
  }catch(e){ return u; }
}

function updatePrev(){
  var url = buildUrl();
  $("prev").textContent = url || "(vul URL in)";
}

$("url").addEventListener("input", updatePrev);
$("apikey").addEventListener("input", updatePrev);
$("keyparam").addEventListener("input", updatePrev);

function log(txt, cls){
  var li = document.createElement("li");
  li.className = cls || "";
  var t = new Date().toLocaleTimeString();
  li.textContent = t + "  " + txt;
  var list = $("loglist");
  if(list.firstChild && list.firstChild.textContent === "Nog geen logs") list.innerHTML = "";
  list.insertBefore(li, list.firstChild);
  while(list.children.length > 200) list.removeChild(list.lastChild);
}

$("send").addEventListener("click", function(){
  var url = buildUrl();
  if(!url){ showStatus("err","Geen URL ingevuld"); return; }
  if(!$("apikey").value.trim()){ showStatus("err","Geen API key ingevuld"); return; }

  $("send").disabled = true;
  $("send").textContent = "⏳ Verzenden...";
  $("resp").style.display = "none";

  log("🚀 " + method + " " + url, "");

  var opts = { method: method, headers: {"Content-Type":"application/json"} };
  if((method === "POST" || method === "PUT") && $("body").value.trim()){
    opts.body = $("body").value.trim();
  }

  fetch(url, opts)
    .then(function(r){
      return r.text().then(function(t){ return { status: r.status, body: t }; });
    })
    .then(function(res){
      log("✅ HTTP " + res.status, res.status === 200 ? "ok" : "err");
      showStatus(res.status === 200 ? "ok" : "err", "HTTP " + res.status);
      var pretty = res.body;
      try{ pretty = JSON.stringify(JSON.parse(res.body), null, 2); }catch(e){}
      $("resp").textContent = pretty;
      $("resp").style.display = "block";
    })
    .catch(function(err){
      log("❌ " + err.message, "err");
      showStatus("err", "Fout: " + err.message);
    })
    .finally(function(){
      $("send").disabled = false;
      $("send").textContent = "🚀 Verzenden";
    });
});

$("copy").addEventListener("click", function(){
  var url = buildUrl();
  if(!url) return;
  navigator.clipboard.writeText(url);
  $("copy").textContent = "✅ Gekopieerd!";
  setTimeout(function(){ $("copy").textContent = "📋 Kopieer URL"; }, 1500);
});

function showStatus(t, msg){
  var s = $("status");
  s.className = "status " + t;
  s.textContent = msg;
  s.style.display = "block";
}
</script>
</body>
</html>
